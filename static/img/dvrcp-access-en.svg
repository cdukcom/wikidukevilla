<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Fácil IoT → traDUKtor / DVRCP → compatible access equipment</title><desc id="desc">Network functions remain on the access equipment. Capabilities depend on the device model, firmware and validated adapter. WiFi and captive portals are optional.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102c43"/><stop offset="1" stop-color="#071a2b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L8 5L0 10" fill="none" stroke="#d5b04b" stroke-width="2"/></marker></defs><rect width="1000" height="580" rx="28" fill="url(#bg)"/><g font-family="Arial, sans-serif" text-anchor="middle"><text x="500" y="60" fill="#fff" font-size="29" font-weight="700">DVRCP</text><text x="500" y="93" fill="#9dc6d7" font-size="18">Remote configuration · observed results · optional captive access</text><g fill="#173e54" stroke="#498196" stroke-width="2"><rect x="45" y="180" width="250" height="170" rx="22"/><rect x="375" y="180" width="250" height="170" rx="22"/><rect x="705" y="180" width="250" height="170" rx="22"/></g><g stroke="#d5b04b" stroke-width="4" marker-end="url(#arrow)"><path d="M305 265H355"/><path d="M635 265H685"/></g><g fill="#fff" font-size="26" font-weight="700"><text x="170" y="250">Fácil IoT</text><text x="500" y="245">traDUKtor</text><text x="500" y="278" font-size="22">DVRCP</text><text x="830" y="245" font-size="23">Access equipment</text></g><g fill="#a8d3e1" font-size="18"><text x="170" y="288">Orchestration</text><text x="500" y="313">Local execution</text><text x="830" y="285">Validated device adapters</text></g><path d="M830 350V395" fill="none" stroke="#3db6cd" stroke-width="3"/><rect x="675" y="400" width="310" height="105" rx="18" fill="#123448" stroke="#3db6cd" stroke-dasharray="7 5"/><text x="830" y="445" fill="#fff" font-size="22">WiFi + captive portal</text><text x="830" y="477" fill="#9dc6d7" font-size="18">When supported</text><text x="330" y="465" fill="#d5b04b" font-size="20">Ethernet / IP · Local execution</text></g></svg>